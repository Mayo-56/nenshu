<title>持ち物ノート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap">
<style>
/* PINK DAYS ― 淡いピンク × ローズ × 白。ラベンダーとピーチは小さな目印だけ
   レイアウト：上…ブランド名と予定ボタン ／ ヒーロー…日付・進捗の数字と Bloom（花）／ 一覧…白いカードに「この日だけ」「毎週◯曜日」「今回は不要」
   下…浮いたガラスのドック（週の切り替え・追加ボタン・7日分の日付）。立体感はやわらかい影 1 種類だけで出す */
:root {
  --bg: #FFF7F9;          /* 画面の地（ほんのりピンクの白） */
  --surface: #FFFFFF;     /* カード・シート */
  --surface-2: #FFF1F4;   /* 入力欄・セグメントの地 */
  --rose: #CC6680;        /* ローズピンク：選択・塗りのボタン・チェック済み */
  --rose-ink: #A4465F;    /* ローズを小さな文字に使うとき */
  --petal: #EFA3B5;       /* 花びら（外側） */
  --blush: #F8D9E0;       /* 淡いピンク：花びら（内側）・選択の下地 */
  --blush-2: #FDEBEF;
  --lav: #C9B8EE; --lav-soft: #F1EBFD; --lav-ink: #6C58A6;     /* ラベンダー（毎週の目印） */
  --peach: #FFC9AE; --peach-soft: #FFEFE6; --peach-ink: #A55A35; /* ピーチ（この日だけの目印・花の中心） */
  --ink: #3B2C33; --ink-2: #7A6670; --ink-3: #AE99A2;
  --line: #F3E2E7;
  --on-rose: #FFFFFF;
  --danger: #C63E5B; --ok: #4BA375; --warn: #C9853A; --warn-ink: #8F5A1F;
  --scrim: rgba(59, 44, 51, .30);
  --glass: rgba(255, 250, 251, .80);
  --toast-bg: #3B2C33; --toast-fg: #FFFFFF; --toast-act: #F8C3D0;
  --shadow: 0 1px 2px rgba(164, 70, 95, .05), 0 10px 28px -12px rgba(164, 70, 95, .22);
  --shadow-lift: 0 2px 6px rgba(164, 70, 95, .10), 0 16px 40px -14px rgba(164, 70, 95, .32);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  --font-num: "Outfit", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  --r-s: 12px; --r-m: 16px; --r-l: 22px; --r-xl: 28px;
  --dock-h: 170px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --mk-ease-decel: cubic-bezier(.16, 1, .3, 1); --mk-ease-standard: cubic-bezier(.25, .8, .25, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1B1317; --surface: #261B20; --surface-2: #31232A; --rose: #E58CA2; --rose-ink: #F2A9BA; --petal: #C96A84; --blush: #5A3442; --blush-2: #33222A;
  --lav: #8E7BC8; --lav-soft: #2D2640; --lav-ink: #C7B8F4; --peach: #E3A07F; --peach-soft: #3A2922; --peach-ink: #F3BEA4;
  --ink: #F8EAF0; --ink-2: #C9B2BC; --ink-3: #8B747E; --line: #3A2A31; --on-rose: #2A1219;
  --danger: #F07A92; --ok: #6CC793; --warn: #E0A35C; --warn-ink: #F0BE84;
  --scrim: rgba(0, 0, 0, .5); --glass: rgba(38, 27, 32, .82); --toast-bg: #F8EAF0; --toast-fg: #2A1A21; --toast-act: #A4465F;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -12px rgba(0, 0, 0, .6); --shadow-lift: 0 2px 6px rgba(0, 0, 0, .35), 0 16px 40px -14px rgba(0, 0, 0, .7);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #1B1317; --surface: #261B20; --surface-2: #31232A; --rose: #E58CA2; --rose-ink: #F2A9BA; --petal: #C96A84; --blush: #5A3442; --blush-2: #33222A;
  --lav: #8E7BC8; --lav-soft: #2D2640; --lav-ink: #C7B8F4; --peach: #E3A07F; --peach-soft: #3A2922; --peach-ink: #F3BEA4;
  --ink: #F8EAF0; --ink-2: #C9B2BC; --ink-3: #8B747E; --line: #3A2A31; --on-rose: #2A1219;
  --danger: #F07A92; --ok: #6CC793; --warn: #E0A35C; --warn-ink: #F0BE84;
  --scrim: rgba(0, 0, 0, .5); --glass: rgba(38, 27, 32, .82); --toast-bg: #F8EAF0; --toast-fg: #2A1A21; --toast-act: #A4465F;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -12px rgba(0, 0, 0, .6); --shadow-lift: 0 2px 6px rgba(0, 0, 0, .35), 0 16px 40px -14px rgba(0, 0, 0, .7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0; color: var(--ink); background: var(--bg); font-family: var(--font); font-size: 16px; line-height: 1.55; letter-spacing: .02em;
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
/* 画面上部のほのかな光（背景の飾り。スクロールしても動かない） */
body::after {
  content: ""; position: fixed; z-index: -1; inset: 0 0 auto; height: 360px; pointer-events: none;
  background: radial-gradient(120% 80% at 90% -10%, var(--blush-2), transparent 60%), radial-gradient(70% 60% at 0% 0%, var(--lav-soft), transparent 70%);
  opacity: .9;
}
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; border-radius: 12px; }
.ic { width: 22px; height: 22px; flex: none; }
.ic-fb { display: inline-grid; place-items: center; width: 22px; height: 22px; font-size: 18px; line-height: 1; }

.wrap {
  max-width: 560px; margin: 0 auto; touch-action: pan-y;
  padding-top: max(18px, env(safe-area-inset-top, 0px));
  padding-bottom: calc(var(--dock-h) + 24px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---- ヘッダー ---- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
.wordmark { font-family: var(--font-num); font-size: 15px; font-weight: 600; letter-spacing: .22em; color: var(--rose-ink); }
.wordmark i { font-style: normal; color: var(--ink-3); font-weight: 400; }
.sync { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow);
  font-size: 11.5px; line-height: 1.2; letter-spacing: .03em; color: var(--ink-2); white-space: nowrap; }
.sync i { position: relative; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); flex: none; }
.sync[data-s=synced] i { background: var(--ok); }
.sync[data-s=syncing] i { background: var(--rose); }
.sync[data-s=syncing] i::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--rose); animation: pulse 1.2s var(--mk-ease-standard) infinite; }
.sync[data-s=error] { color: var(--warn-ink); }
.sync[data-s=error] i { background: var(--warn); }
@keyframes pulse { from { transform: scale(1); opacity: .7; } to { transform: scale(2.6); opacity: 0; } }
.plan-btn {
  position: relative; flex: none; display: grid; place-items: center; width: 46px; height: 46px; margin-right: -2px;
  border: 0; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); color: var(--rose-ink);
}
.plan-btn .cnt { position: absolute; top: -3px; right: -3px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--rose); color: var(--on-rose);
  border: 2px solid var(--bg); font-size: 10.5px; font-weight: 600; line-height: 15px; text-align: center; }

/* ---- ヒーロー：日付・数字と Bloom ---- */
.hero {
  position: relative; margin-top: 14px; padding: 22px 18px 18px 22px; border-radius: var(--r-xl); overflow: hidden;
  background:
    radial-gradient(90% 90% at 100% 0%, var(--peach-soft), transparent 60%),
    radial-gradient(80% 90% at 0% 100%, var(--lav-soft), transparent 65%),
    linear-gradient(160deg, var(--blush-2), var(--surface) 70%);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .55);
}
.hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
.head-txt { min-width: 0; display: flex; flex-direction: column; }
.kicker { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .06em; color: var(--rose-ink); }
.date { margin: 4px 0 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 2px; font-weight: 500; line-height: 1.05; color: var(--ink); }
.date .n { font-family: var(--font-num); font-size: 44px; font-weight: 500; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.date .u { font-size: 17px; font-weight: 600; margin-right: 4px; color: var(--ink-2); }
.date .wd { flex-basis: 100%; margin-top: 6px; font-size: 14px; font-weight: 500; letter-spacing: .06em; color: var(--ink-2); }
.count { margin: 16px 0 0; display: flex; align-items: baseline; gap: 6px; }
.count b { font-family: var(--font-num); font-size: 30px; font-weight: 600; line-height: 1; color: var(--rose-ink); font-variant-numeric: tabular-nums; }
.count .of { font-family: var(--font-num); font-size: 17px; color: var(--ink-3); }
.count .lbl { font-size: 13px; color: var(--ink-2); margin-left: 2px; }
.prog-note { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-2); }
.prog-note.done { color: var(--rose-ink); font-weight: 600; }
.bar { position: relative; height: 6px; margin-top: 16px; border-radius: 3px; background: color-mix(in srgb, var(--blush) 70%, transparent); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--lav), var(--petal) 55%, var(--rose)); transition: width .6s var(--mk-ease-decel); }

/* Bloom Progress：外側 8 枚・内側 6 枚の花びらが、--po / --pi（0〜1）に合わせてつぼみから開く */
.bloom-box { position: relative; width: 132px; height: 132px; margin: -6px -4px -6px 0; }
.bloom { width: 100%; height: 100%; overflow: visible; }
.bloom .petal { transform-box: view-box; transform-origin: 0 0;
  transform: rotate(calc(var(--b) + (var(--o) - var(--b)) * var(--q))) scale(calc(.62 + .38 * var(--q)));
  transition: transform .9s var(--mk-ease-decel), opacity .5s ease; transition-delay: calc(var(--k) * 35ms); }
.bloom .outer .petal { --q: var(--po, 0); fill: var(--petal); }
.bloom .inner .petal { --q: var(--pi, 0); fill: var(--blush); }
.bloom .outer .petal { opacity: calc(.72 + .28 * var(--po, 0)); }
.bloom .vein { fill: none; stroke: var(--rose); stroke-width: .9; stroke-linecap: round; opacity: .35; }
.bloom .core { fill: var(--peach); transition: transform .8s var(--mk-ease-decel); transform-box: view-box; transform-origin: 0 0; transform: scale(calc(.55 + .45 * var(--po, 0))); }
.bloom .seed { fill: var(--peach-ink); opacity: calc(.15 + .5 * var(--po, 0)); transition: opacity .6s ease; }
.bloom .halo { fill: none; stroke: var(--petal); stroke-width: 1; stroke-dasharray: 2 5; stroke-linecap: round; opacity: 0; transform-box: view-box; transform-origin: 0 0; transform: scale(.8) rotate(0deg); transition: opacity .6s ease, transform 1s var(--mk-ease-decel); }
.bloom.empty .petal { fill: var(--petal); opacity: .5; }
.bloom.empty .core { fill: var(--blush); }
.bloom.full .halo { opacity: .8; transform: scale(1) rotate(30deg); }
.bloom .sp { fill: var(--petal); opacity: 0; transform-box: view-box; transform-origin: 0 0; }
.bloom.cele { animation: pop .9s var(--mk-ease-decel); transform-origin: 50% 50%; }
.bloom.cele .sp { animation: drift 1.6s var(--mk-ease-decel) forwards; animation-delay: calc(var(--k) * 60ms); }
@keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.07); } 100% { transform: scale(1); } }
@keyframes drift { 0% { opacity: 0; transform: rotate(var(--r)) translateY(-30px) scale(.4); } 25% { opacity: .9; } 100% { opacity: 0; transform: rotate(calc(var(--r) + 40deg)) translateY(-64px) scale(1); } }
.bloom-cap { position: absolute; left: 0; right: 0; bottom: -2px; text-align: center; font-family: var(--font-num); font-size: 11px; letter-spacing: .18em; color: var(--ink-3); }

/* ---- 一覧 ---- */
.secs { margin-top: 26px; display: flex; flex-direction: column; gap: 22px; }
.sec-h { display: flex; align-items: center; gap: 8px; margin: 0 0 10px 4px; font-size: 13.5px; font-weight: 600; letter-spacing: .05em; color: var(--ink-2); }
.chip { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 8px; flex: none; }
.chip .ic { width: 15px; height: 15px; }
.chip.peach { background: var(--peach-soft); color: var(--peach-ink); }
.chip.lav { background: var(--lav-soft); color: var(--lav-ink); }
.chip.mute { background: var(--surface-2); color: var(--ink-3); }
.sec-h .n { font-family: var(--font-num); font-weight: 400; color: var(--ink-3); }
.sec-h .hint { margin-left: auto; margin-right: 4px; font-size: 12px; font-weight: 400; color: var(--ink-3); }
.card { background: var(--surface); border-radius: var(--r-l); box-shadow: var(--shadow); overflow: hidden; }
ul.list { list-style: none; margin: 0; padding: 2px 0; }
ul.list:empty { display: none; }
.item { position: relative; }
.item + .item::before { content: ""; position: absolute; top: 0; left: 56px; right: 16px; height: 1px; background: var(--line); }
.row-in { display: grid; grid-template-columns: minmax(0, 1fr) 48px; align-items: center; min-height: 58px; }
.tap { display: flex; align-items: center; gap: 4px; width: 100%; min-height: 58px; padding: 8px 0 8px 10px; border: 0; background: none; text-align: left; border-radius: var(--r-m); }
.chk { position: relative; width: 40px; height: 44px; flex: none; display: grid; place-items: center; color: var(--on-rose); }
.chk::before {
  content: ""; grid-area: 1 / 1; width: 26px; height: 26px; border-radius: 50%; border: 1.75px solid var(--petal); background: var(--surface);
  transition: background-color .18s var(--mk-ease-standard), border-color .18s var(--mk-ease-standard), box-shadow .3s ease;
}
.chk svg { grid-area: 1 / 1; position: relative; width: 15px; height: 15px; stroke-width: 3; }
.chk path { stroke-dasharray: 1; stroke-dashoffset: 1; }
.item.donep .chk::before { background: var(--rose); border-color: var(--rose); box-shadow: 0 3px 10px -3px var(--rose); }
.item.donep .chk path { stroke-dashoffset: 0; }
.skipic { width: 40px; height: 44px; flex: none; display: grid; place-items: center; }
.skipic::before { content: ""; width: 24px; height: 24px; border-radius: 50%; border: 1.5px dashed var(--ink-3); }
.tx { min-width: 0; display: flex; flex-direction: column; padding-left: 4px; }
.t { font-size: 16px; font-weight: 500; line-height: 1.45; letter-spacing: .03em; overflow-wrap: anywhere; transition: color .25s ease; }
.item.donep .t, .item.skipped .t { color: var(--ink-3); }
.m { font-size: 12px; color: var(--ink-3); }
.more { width: 44px; height: 44px; padding: 0; border: 0; background: none; border-radius: var(--r-s); color: var(--ink-3); display: grid; place-items: center; }
.more .ic { width: 20px; height: 20px; }
.more:active, .tap:active { background: var(--surface-2); }
.empty { margin: 0; padding: 16px 18px; font-size: 14px; line-height: 1.6; color: var(--ink-3); }
.later { margin: 10px 4px 0; font-size: 13px; line-height: 1.6; color: var(--ink-2); }

/* その日に持ち物がないとき・まだ何も登録していないとき */
.calm { margin-top: 26px; padding: 26px 22px; display: grid; justify-items: center; gap: 6px; text-align: center; }
.calm .art { position: relative; width: 74px; height: 74px; margin-bottom: 8px; display: grid; place-items: center; color: var(--rose-ink); }
.calm .art::before, .calm .art::after { content: ""; position: absolute; border-radius: 50%; }
.calm .art::before { inset: 0; background: radial-gradient(circle at 30% 30%, var(--blush-2), var(--blush)); }
.calm .art::after { width: 26px; height: 26px; right: -6px; top: -2px; background: var(--peach-soft); box-shadow: -58px 46px 0 -6px var(--lav-soft); }
.calm .art .ic { position: relative; z-index: 1; width: 30px; height: 30px; }
.calm b { font-size: 16px; font-weight: 600; letter-spacing: .04em; }
.calm span { font-size: 14px; line-height: 1.75; color: var(--ink-2); max-width: 300px; }
.calm .later { margin-top: 8px; }
.ghost { margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: var(--rose); color: var(--on-rose); font-size: 15px; font-weight: 600; box-shadow: 0 6px 16px -6px var(--rose); }
.ghost .ic { width: 18px; height: 18px; }

/* ---- 下のドック（浮いたガラス） ---- */
.dock {
  position: fixed; z-index: 20; left: 0; right: 0; bottom: 0;
  padding-bottom: max(10px, var(--safe-b));
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.dock-in {
  max-width: 560px; margin: 0 auto; padding: 8px 8px 6px; border-radius: 26px; pointer-events: auto;
  background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(1.5); backdrop-filter: blur(20px) saturate(1.5);
  border: 1px solid color-mix(in srgb, var(--line) 80%, transparent); box-shadow: var(--shadow-lift);
}
.tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 2px 2px 4px; }
.weeknav { display: flex; align-items: center; gap: 0; min-width: 0; }
.weeknav .lbl { min-width: 0; padding: 0 2px; font-size: 13px; letter-spacing: .02em; color: var(--ink-2); white-space: nowrap; }
.navb { width: 40px; height: 44px; padding: 0; border: 0; background: none; border-radius: var(--r-s); color: var(--rose-ink); display: grid; place-items: center; }
.navb .ic { width: 20px; height: 20px; }
.navb:disabled { color: var(--line); cursor: default; }
.add {
  display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px 0 12px; border: 0; border-radius: 999px;
  background: var(--rose); color: var(--on-rose); font-size: 15px; font-weight: 600; letter-spacing: .04em; box-shadow: 0 6px 16px -6px var(--rose);
}
.add .ic { width: 18px; height: 18px; stroke-width: 2.4; }
.strip-wrap { overflow: hidden; touch-action: pan-y; padding: 2px 0 0; }
.strip { position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; align-items: center; }
.sel-ind { position: absolute; z-index: 0; top: 2px; left: 0; width: 44px; height: 62px; border-radius: 18px; background: var(--rose); box-shadow: 0 8px 18px -8px var(--rose); pointer-events: none; }
.day {
  position: relative; z-index: 1; min-width: 0; height: 66px; padding: 0 0 6px; border: 0; background: transparent; border-radius: 18px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
}
.day small { font-size: 11px; font-weight: 500; line-height: 1; letter-spacing: .06em; color: var(--ink-2); transition: color .2s ease; }
.day b { width: 32px; height: 28px; display: grid; place-items: center; font-family: var(--font-num); font-size: 18px; font-weight: 500; line-height: 1; color: var(--ink); transition: color .2s ease; font-variant-numeric: tabular-nums; }
.day.past b, .day.past small { color: var(--ink-3); opacity: .6; }
.day.today:not([aria-current=true]) b { color: var(--rose-ink); font-weight: 600; }
.day.today:not([aria-current=true]) small { color: var(--rose-ink); font-weight: 600; }
.day[aria-current=true] b, .day[aria-current=true] small { color: var(--on-rose); font-weight: 600; }
.day .has { position: absolute; bottom: 8px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--petal); }
.day[aria-current=true] .has { background: var(--on-rose); }

/* スクロールすると上に出る小さな見出し */
.cbar {
  position: fixed; z-index: 15; top: 0; left: 0; right: 0; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 11px) max(16px, env(safe-area-inset-right, 0px)) 11px max(16px, env(safe-area-inset-left, 0px));
  text-align: center; font-size: 15px; font-weight: 600; color: var(--ink);
  background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
  border-bottom: 1px solid var(--line); opacity: var(--mk-collapse, 0);
}

/* ---- シート ---- */

      msg = "「" + text + "」を毎週" + days.map(w => WD[w]).join("・") + "曜日に追加しました（" + days.map(w => md(firstOcc(w, from))).join("、") + "から）";
    }
    $("aText").value = ""; $("aSave").disabled = true; $("aErr").hidden = true;
    showMsg(msg);
    commit();
    $("aText").focus({ preventScroll: true });
  });

  // ---- 編集 ----
  const findW = (id) => state.weekly.find(x => x.id === id);
  const findX = (id) => state.extras.find(x => x.id === id);
  function openEdit(kind, id, date, opener, switching) {
    const it = kind === "w" ? findW(id) : findX(id);
    if (!it) return;
    editing = { kind, id, date };
    $("eText").value = it.text; $("eErr").hidden = true;
    if (kind === "x") {
      $("eTitle").textContent = "この日だけの持ち物";
      $("eDateRow").hidden = false; $("eDate").value = it.date; $("eDate").min = today();
      $("eNote").hidden = true; $("eSkip").hidden = true;
      $("eDelT").textContent = "この持ち物を削除";
    } else {
      const skipped = (state.skips[date] || []).includes(id);
      $("eTitle").textContent = "毎週" + WD[it.wd] + "曜日の持ち物";
      $("eDateRow").hidden = true;
      $("eNote").textContent = (it.from && it.from > today() ? fmt(it.from) + "から表示します。" : "") + "持ち物の名前を変えても、ほかの曜日の同じ持ち物は変わりません。"; $("eNote").hidden = false;
      $("eSkip").hidden = !!(it.from && it.from > date);
      $("eSkipT").textContent = skipped ? fmt(date) + "も持っていく" : fmt(date) + "だけ外す";
      $("eDelT").textContent = "毎週の設定から削除";
    }
    if (switching) hideSheets("switch");
    openSheet("editSheet", opener);
  }
  $("editSheet").addEventListener("submit", (e) => {
    e.preventDefault();
    if (!editing) return hideSheets();
    const it = editing.kind === "w" ? findW(editing.id) : findX(editing.id);
    const text = $("eText").value.trim(), err = (m) => { $("eErr").textContent = m; $("eErr").hidden = false; };
    if (!it) return hideSheets();
    if (!text) return err("持ち物を入力してください。");
    if (editing.kind === "x") {
      const d = $("eDate").value;
      if (!DATE_RE.test(d)) return err("持っていく日を選んでください。");
      if (d < today() && d !== it.date) return err("今日より前の日は選べません。");
      it.date = d;
    }
    it.text = text;
    hideSheets(); commit();
  });
  $("eSkip").onclick = () => {
    if (!editing || editing.kind !== "w") return;
    const { id, date } = editing, on = !(state.skips[date] || []).includes(id);
    hideSheets(); setSkip(id, date, on, true);
  };
  $("eDel").onclick = () => {
    if (!editing) return;
    const { kind, id } = editing, it = kind === "w" ? findW(id) : findX(id);
    if (!it) return hideSheets();
    snapshot();
    if (kind === "w") state.weekly = state.weekly.filter(x => x.id !== id); else state.extras = state.extras.filter(x => x.id !== id);
    hideSheets(); commit();
    toast("「" + it.text + "」を削除しました");
  };

  // ---- 予定 ----
  function renderPlan() {
    const t = today(), box = $("planList");
    const list = state.extras.filter(x => x.date >= t).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : byCreated(a, b));
    box.innerHTML = "";
    $("planNone").hidden = !!list.length;
    const groups = new Map();
    list.forEach(x => { if (!groups.has(x.date)) groups.set(x.date, []); groups.get(x.date).push(x); });
    groups.forEach((items, d) => {
      const g = el("div", "plan-day");
      const h = el("p", "plan-h", fmt(d)); h.append(el("span", "rel", rel(d)));
      const card = el("div", "plan-g");
      items.forEach(x => {
        const b = el("button", "plan-row"); b.type = "button"; b.dataset.press = "large";
        b.append(el("span", "", x.text), ic("ChevronRight"));
        b.setAttribute("aria-label", fmt(d) + " " + x.text + " の編集");
        b.onclick = () => openEdit("x", x.id, x.date, $("planBtn"), true);
        card.append(b);
      });
      g.append(h, card);
      box.append(g);
    });
  }
  $("planBtn").onclick = () => { renderPlan(); openSheet("planSheet", $("planBtn")); };

  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
  setInterval(() => { if (curKey() !== autoKey) render(); else renderStrip(); }, 60000);

  // ---- 起動 ----
  paintIcons();
  state = loadLocal(); prune();
  render();
  K.pressable(document, "button");
  document.querySelectorAll(".act, .seg button, .primary, .switch-row, .ghost").forEach(b => { b.dataset.press = "large"; });
  document.querySelectorAll(".navb, .plan-btn").forEach(b => { b.dataset.press = "icon"; });
  $("fab").dataset.press = "0.95";
  SHEETS.forEach(id => { const g = $(id).querySelector(".grab"); if (g) K.sheetDrag($(id), g, () => hideSheets("dragged")); });
  K.scrollHeader($("cbar"), { range: 64 });
  measureDock(); moveSel(true);
  window.addEventListener("resize", () => { measureDock(); moveSel(true); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measureDock(); moveSel(true); });
  requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove("preload")));
  setSync("local");

  (async function connect() {
    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.collection("data/users/" + id).doc("mochimono");
      let first = true;
      setSync("syncing");
      const timer = setTimeout(() => { setSync("error", "同期先につながりません。この端末には保存されます。"); }, 10000);
      ref.onSnapshot((snap) => {
        if (!snap.metadata.fromCache) clearTimeout(timer);
        if (snap.metadata.hasPendingWrites) return;
        if (first && snap.metadata.fromCache && !snap.exists) return;
        const data = snap.exists ? snap.data() : null;
        if (first) {
          first = false; docRef = ref;
          if (!data) {
            if (state.weekly.length || state.extras.length) { dirty = true; flush(); }
            else setSync("synced");
            return;
          }
        }
        if (!data) return;
        if (dirty || writing) { flush(); return; }
        state = normalize(data); prune();
        saveLocal(); K.layout($("content"), render);
        if (!snap.metadata.fromCache) setSync("synced");
      }, () => { clearTimeout(timer); docRef = null; setSync("error", "同期できませんでした。この端末には保存されています。"); });
    } catch (e) { /* この端末の保存だけで動く */ }
  })();
})();
</script>
