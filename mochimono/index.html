<title>持ち物ノート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap">
<style>
/* PINK DAYS ― 「毎日ひとつ花が咲く」持ち物ノート
   レイアウト：上…画面幅いっぱいのアーチ（日付を大きく・曜日ごとに違う花・花のまわりに持ち物の数だけ花びらの目盛り）
             アーチの下端に「そろった数」の札が重なる ／ 中…持ち物を1つずつ浮かせた札（花の形のチェック）
             下…浮いたガラスのドック（アーチ形の選択・2色の花びらドット）
   色：淡いピンク・ローズ・白が主役。ピーチ＝この日だけ、ラベンダー＝毎週 の目印にだけ使う
   動き：押す＝縮んで弾んで戻る／入る＝下から弾んで／出る＝横へ速く／切り替え＝進む方向へ滑る（ばねで統一） */
:root {
  --bg: #FFF7F9;
  --surface: #FFFFFF;
  --surface-2: #FFF0F3;
  --done-bg: #FFF5F7;
  --rose: #CC6680; --rose-ink: #A4465F;
  --petal: #EFA3B5; --blush: #F8D9E0; --blush-2: #FDEBEF;
  --hero-a: #FCE3E9; --hero-b: #FFF4F6;
  --lav: #C9B8EE; --lav-soft: #EFE8FC; --lav-ink: #6C58A6;
  --peach: #FFC9AE; --peach-soft: #FFEDE3; --peach-ink: #A55A35;
  --ink: #3B2C33; --ink-2: #6F5B65; --ink-3: #A08B95;
  --line: #F3E2E7;
  --on-rose: #FFFFFF;
  --danger: #C63E5B; --ok: #4BA375; --warn: #C9853A; --warn-ink: #8F5A1F;
  --scrim: rgba(59, 44, 51, .34);
  --glass: rgba(255, 250, 251, .84);
  --toast-bg: #3B2C33; --toast-fg: #FFFFFF; --toast-act: #F8C3D0;
  --shadow-sm: 0 1px 2px rgba(164, 70, 95, .06), 0 6px 16px -10px rgba(164, 70, 95, .28);
  --shadow: 0 1px 2px rgba(164, 70, 95, .05), 0 10px 28px -12px rgba(164, 70, 95, .26);
  --shadow-lift: 0 2px 6px rgba(164, 70, 95, .10), 0 18px 44px -14px rgba(164, 70, 95, .36);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  --font-num: "Outfit", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --dock-h: 180px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --ease-out: cubic-bezier(.16, 1, .3, 1); --ease-std: cubic-bezier(.25, .8, .25, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1B1317; --surface: #271C21; --surface-2: #33252C; --done-bg: #22181D;
  --rose: #E58CA2; --rose-ink: #F2A9BA; --petal: #C96A84; --blush: #5A3442; --blush-2: #33222A; --hero-a: #3A2530; --hero-b: #21171C;
  --lav: #8E7BC8; --lav-soft: #2D2640; --lav-ink: #C7B8F4; --peach: #E3A07F; --peach-soft: #3A2922; --peach-ink: #F3BEA4;
  --ink: #F8EAF0; --ink-2: #D2BCC6; --ink-3: #98818B; --line: #3A2A31; --on-rose: #2A1219;
  --danger: #F07A92; --ok: #6CC793; --warn: #E0A35C; --warn-ink: #F0BE84;
  --scrim: rgba(0, 0, 0, .55); --glass: rgba(39, 28, 33, .86); --toast-bg: #F8EAF0; --toast-fg: #2A1A21; --toast-act: #A4465F;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 16px -10px rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -12px rgba(0, 0, 0, .6); --shadow-lift: 0 2px 6px rgba(0, 0, 0, .35), 0 18px 44px -14px rgba(0, 0, 0, .7);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #1B1317; --surface: #271C21; --surface-2: #33252C; --done-bg: #22181D;
  --rose: #E58CA2; --rose-ink: #F2A9BA; --petal: #C96A84; --blush: #5A3442; --blush-2: #33222A; --hero-a: #3A2530; --hero-b: #21171C;
  --lav: #8E7BC8; --lav-soft: #2D2640; --lav-ink: #C7B8F4; --peach: #E3A07F; --peach-soft: #3A2922; --peach-ink: #F3BEA4;
  --ink: #F8EAF0; --ink-2: #D2BCC6; --ink-3: #98818B; --line: #3A2A31; --on-rose: #2A1219;
  --danger: #F07A92; --ok: #6CC793; --warn: #E0A35C; --warn-ink: #F0BE84;
  --scrim: rgba(0, 0, 0, .55); --glass: rgba(39, 28, 33, .86); --toast-bg: #F8EAF0; --toast-fg: #2A1A21; --toast-act: #A4465F;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 16px -10px rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -12px rgba(0, 0, 0, .6); --shadow-lift: 0 2px 6px rgba(0, 0, 0, .35), 0 18px 44px -14px rgba(0, 0, 0, .7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); touch-action: manipulation; }
body {
  margin: 0; color: var(--ink); background: var(--bg); font-family: var(--font); font-size: 17px; line-height: 1.55; letter-spacing: .02em;
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
}
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; border-radius: 14px; }
.ic, .gl { width: 24px; height: 24px; flex: none; }
.gl { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.ic-fb { display: inline-grid; place-items: center; font-size: 19px; line-height: 1; }

#main { touch-action: pan-y; transform-origin: 50% 0; }

/* ---- アーチ（ヒーロー） ---- */
.hero {
  position: relative; isolation: isolate;
  padding: 10px var(--gutter-r) 58px var(--gutter);
  border-bottom-left-radius: 50% 44px; border-bottom-right-radius: 50% 44px;
  background:
    radial-gradient(70% 60% at 100% 10%, var(--peach-soft), transparent 70%),
    radial-gradient(60% 70% at 0% 90%, var(--lav-soft), transparent 70%),
    linear-gradient(180deg, var(--hero-a), var(--hero-b));
}
/* 背景の大きな花びら2枚（静かな飾り） */
.hero-deco { position: absolute; inset: 0; z-index: -1; overflow: hidden; border-radius: inherit; pointer-events: none; }
.hero-deco::before, .hero-deco::after { content: ""; position: absolute; border-radius: 0 100% 0 100%; }
.hero-deco::before { width: 210px; height: 210px; right: -70px; top: -60px; background: var(--blush); opacity: .55; transform: rotate(18deg); }
.hero-deco::after { width: 120px; height: 120px; left: -46px; bottom: 30px; background: var(--lav-soft); opacity: .9; transform: rotate(-30deg); }
.hero-in { max-width: 560px; margin: 0 auto; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
.wordmark { font-family: var(--font-num); font-size: 15px; font-weight: 600; letter-spacing: .24em; color: var(--rose-ink); }
.wordmark i { font-style: normal; color: var(--petal); }
.sync { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px 5px 9px; border-radius: 999px; background: color-mix(in srgb, var(--surface) 70%, transparent);
  font-size: 12.5px; line-height: 1.2; color: var(--ink-2); white-space: nowrap; }
.sync i { position: relative; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex: none; }
.sync[data-s=synced] i { background: var(--ok); }
.sync[data-s=syncing] i { background: var(--rose); }
.sync[data-s=syncing] i::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--rose); animation: pulse 1.2s var(--ease-std) infinite; }
.sync[data-s=error] { color: var(--warn-ink); }
.sync[data-s=error] i { background: var(--warn); }
@keyframes pulse { from { transform: scale(1); opacity: .7; } to { transform: scale(2.6); opacity: 0; } }
.plan-btn {
  position: relative; flex: none; display: grid; place-items: center; width: 50px; height: 50px; margin-right: -3px;
  border: 0; border-radius: 18px 50% 50% 50%; background: var(--surface); box-shadow: var(--shadow); color: var(--rose-ink);
}
.plan-btn .cnt { position: absolute; top: -4px; right: -4px; min-width: 21px; height: 21px; padding: 0 5px; border-radius: 11px; background: var(--rose); color: var(--on-rose);
  border: 2px solid var(--hero-a); font-size: 11.5px; font-weight: 600; line-height: 17px; text-align: center; }

.hero-main { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px; margin-top: 6px; }
.head-txt { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
.kicker { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .05em; color: var(--rose-ink); }
.date { margin: 6px 0 0; display: grid; grid-template-columns: auto; justify-items: start; line-height: 1; font-weight: 500; }
.date .mo { font-family: var(--font-num); font-size: 22px; font-weight: 500; color: var(--ink-2); letter-spacing: .02em; }
.date .mo small { font-family: var(--font); font-size: 16px; font-weight: 600; margin-left: 2px; }
.date .dy { margin-top: 2px; font-family: var(--font-num); font-size: 88px; font-weight: 500; letter-spacing: -.03em; line-height: .92; color: var(--ink); font-variant-numeric: tabular-nums; }
.date .wd { margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px 6px 10px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-sm);
  font-size: 16px; font-weight: 600; letter-spacing: .06em; color: var(--ink); }
.date .wd::before { content: ""; width: 9px; height: 12px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: var(--petal); }

/* Bloom：曜日ごとに違う花。持ち物がそろうほど開き、まわりの目盛り（持ち物の数）が色づく */
.bloom-box { position: relative; width: 178px; margin-right: -10px; display: flex; flex-direction: column; align-items: center; }
.bloom { width: 178px; height: 178px; overflow: visible; display: block; }
.bloom .petal { transform-box: view-box; transform-origin: 0 0;
  transform: rotate(calc(var(--b) + (var(--o) - var(--b)) * var(--q))) scale(calc(.6 + .4 * var(--q)));
  transition: transform .95s var(--ease-out); transition-delay: calc(var(--k) * 32ms); }
.bloom .r0 .petal { --q: var(--q0, 0); }
.bloom .r1 .petal { --q: var(--q1, 0); }
.bloom .r2 .petal { --q: var(--q2, 0); }
.bloom .f-petal { fill: var(--petal); }
.bloom .f-blush { fill: var(--blush); }
.bloom .f-peach { fill: var(--peach); }
.bloom .f-lav { fill: var(--lav); }
.bloom .petal.edge { stroke: var(--rose); stroke-width: .8; stroke-opacity: .35; }
.bloom .core { transform-box: view-box; transform-origin: 0 0; transform: scale(calc(.6 + .4 * var(--q0, 0))); transition: transform .8s var(--ease-out); }
.bloom .stamen { stroke: var(--peach-ink); stroke-width: .9; stroke-linecap: round; opacity: calc(.2 + .6 * var(--q0, 0)); transition: opacity .6s ease; }
.bloom .seed { fill: var(--peach-ink); opacity: calc(.2 + .5 * var(--q0, 0)); transition: opacity .6s ease; }
.bloom .tick { fill: var(--blush); transform-box: fill-box; transform-origin: 50% 50%; transition: fill .3s ease; }
.bloom .tick.on { fill: var(--rose); }
.bloom .halo { fill: none; stroke: var(--rose); stroke-width: 1; stroke-dasharray: 1 6; stroke-linecap: round; opacity: 0; transform-box: view-box; transform-origin: 0 0; transform: scale(.85) rotate(0deg); transition: opacity .6s ease, transform 1.2s var(--ease-out); }
.bloom.full .halo { opacity: .7; transform: scale(1) rotate(40deg); }
.bloom .sp { fill: var(--petal); opacity: 0; transform-box: view-box; transform-origin: 0 0; }
.bloom.cele .sp { animation: drift 1.7s var(--ease-out) forwards; animation-delay: calc(var(--k) * 55ms); }
@keyframes drift { 0% { opacity: 0; transform: rotate(var(--r)) translateY(-34px) scale(.4); } 25% { opacity: .95; } 100% { opacity: 0; transform: rotate(calc(var(--r) + 50deg)) translateY(-78px) scale(1.1); } }
.bloom.dim .petal { opacity: .55; }
.flower-name { margin-top: -10px; font-size: 13px; letter-spacing: .08em; color: var(--ink-2); white-space: nowrap; }

/* アーチの下端に重なる「そろった数」の札 */
.tally {
  position: absolute; left: 50%; bottom: 0; translate: -50% 50%; z-index: 2;
  display: inline-flex; align-items: center; gap: 10px; min-height: 56px; padding: 6px 20px 6px 14px; border-radius: 999px;
  background: var(--surface); box-shadow: var(--shadow-lift); white-space: nowrap; transition: background-color .35s ease, color .35s ease;
}
.tally .gl { width: 26px; height: 26px; color: var(--rose); }
.tally .cnt { display: inline-flex; align-items: baseline; gap: 4px; }
.tally b { font-family: var(--font-num); font-size: 30px; font-weight: 600; line-height: 1; color: var(--rose-ink); font-variant-numeric: tabular-nums; }
.tally .of { font-family: var(--font-num); font-size: 18px; color: var(--ink-3); }
.tally .lbl { font-size: 14px; color: var(--ink-2); }
.tally .sep { width: 1px; height: 22px; background: var(--line); }
.tally .note { font-size: 15.5px; font-weight: 600; color: var(--ink); }
.tally.full { background: var(--rose); }
.tally.full .gl, .tally.full b, .tally.full .of, .tally.full .lbl, .tally.full .note { color: var(--on-rose); }
.tally.full .sep { background: color-mix(in srgb, var(--on-rose) 40%, transparent); }

/* ---- 本文 ---- */
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-top: 52px; padding-bottom: calc(var(--dock-h) + 28px);
  padding-left: var(--gutter); padding-right: var(--gutter-r);
}
.secs { display: flex; flex-direction: column; gap: 28px; }
.sec-h { display: flex; align-items: center; gap: 10px; margin: 0 0 12px 2px; font-size: 16px; font-weight: 700; letter-spacing: .05em; color: var(--ink); }
.badge { display: inline-grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: 14px 50% 50% 50%; }
.badge .gl { width: 20px; height: 20px; }
.badge.peach { background: var(--peach-soft); color: var(--peach-ink); }
.badge.lav { background: var(--lav-soft); color: var(--lav-ink); }
.badge.mute { background: var(--surface-2); color: var(--ink-3); }
.sec-h .n { font-family: var(--font-num); font-weight: 500; font-size: 16px; color: var(--ink-3); }
.sec-h .hint { margin-left: auto; margin-right: 4px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); }
ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
ul.list:empty { display: none; }
.item { position: relative; }
.row-in { display: grid; grid-template-columns: minmax(0, 1fr) auto 48px; align-items: center; min-height: 66px; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow-sm); transition: background-color .3s ease; }
.item.donep .row-in { background: var(--done-bg); box-shadow: none; }
.item.skipped .row-in { background: transparent; box-shadow: none; border: 1.5px dashed var(--line); }
.tap { display: flex; align-items: center; gap: 6px; width: 100%; min-height: 66px; padding: 8px 0 8px 10px; border: 0; background: none; text-align: left; border-radius: 22px; }
/* 花の形のチェック */
.chk { position: relative; width: 44px; height: 44px; flex: none; display: grid; place-items: center; }
.chk svg { grid-area: 1 / 1; width: 34px; height: 34px; overflow: visible; }
.chk .fl { fill: var(--surface); stroke: var(--petal); stroke-width: 1.8; transition: fill .2s var(--ease-std), stroke .2s var(--ease-std); }
.chk .ck { fill: none; stroke: var(--on-rose); stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
.item.donep .chk .fl { fill: var(--rose); stroke: var(--rose); }
.item.donep .chk .ck { stroke-dashoffset: 0; }
.chk .bp { grid-area: 1 / 1; width: 6px; height: 9px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: var(--petal); opacity: 0; pointer-events: none; }
.chk.burst .bp { animation: burst .62s var(--ease-out) forwards; }
@keyframes burst { 0% { opacity: .95; transform: rotate(var(--a)) translateY(-6px) scale(.6); } 100% { opacity: 0; transform: rotate(var(--a)) translateY(-26px) scale(1); } }
.skipic { width: 44px; height: 44px; flex: none; display: grid; place-items: center; color: var(--ink-3); }
.skipic .gl { width: 30px; height: 30px; stroke-dasharray: 2.2 2.6; stroke-width: 1.5; }
.tx { min-width: 0; display: flex; flex-direction: column; padding-left: 4px; }
.t { font-size: 18px; font-weight: 500; line-height: 1.45; letter-spacing: .03em; overflow-wrap: anywhere; transition: color .25s ease; }
.item.donep .t, .item.skipped .t { color: var(--ink-3); }
.m { font-size: 13.5px; color: var(--ink-2); }
.tag { display: inline-flex; align-items: center; gap: 4px; margin-left: 4px; padding: 4px 9px 4px 7px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.tag .gl { width: 15px; height: 15px; }
.tag.peach { background: var(--peach-soft); color: var(--peach-ink); }
.more { width: 48px; height: 48px; padding: 0; border: 0; background: none; border-radius: 16px; color: var(--ink-3); display: grid; place-items: center; }
.more:active, .tap:active { background: var(--surface-2); }
.empty { margin: 0; padding: 18px 20px; border-radius: 22px; border: 1.5px dashed var(--line); font-size: 15px; line-height: 1.6; color: var(--ink-2); }
.later { margin: 12px 4px 0; font-size: 14.5px; line-height: 1.6; color: var(--ink-2); }

/* その日に持ち物がない／まだ何も登録していない */
.calm { padding: 30px 22px 26px; display: grid; justify-items: center; gap: 8px; text-align: center; background: var(--surface); border-radius: 28px; box-shadow: var(--shadow-sm); }
.calm .art { position: relative; width: 86px; height: 86px; margin-bottom: 8px; display: grid; place-items: center; color: var(--rose-ink); }
.calm .art::before { content: ""; position: absolute; inset: 0; border-radius: 50% 50% 50% 22%; background: radial-gradient(circle at 30% 30%, var(--blush-2), var(--blush)); }
.calm .art::after { content: ""; position: absolute; width: 24px; height: 24px; right: -4px; top: 0; border-radius: 50% 50% 50% 10%; background: var(--peach-soft); }
.calm .art .gl { position: relative; z-index: 1; width: 40px; height: 40px; stroke-width: 1.5; }
.calm b { font-size: 18px; font-weight: 700; letter-spacing: .04em; }
.calm span { font-size: 15px; line-height: 1.75; color: var(--ink-2); max-width: 300px; }
.calm .later { margin-top: 6px; }
.ghost { margin-top: 12px; display: inline-flex; align-items: center; gap: 8px; height: 50px; padding: 0 22px 0 16px; border: 0; border-radius: 999px; background: var(--rose); color: var(--on-rose); font-size: 17px; font-weight: 700; box-shadow: 0 8px 18px -8px var(--rose); }
.ghost .gl { width: 22px; height: 22px; }

/* ---- 下のドック ---- */
.dock {
  position: fixed; z-index: 20; left: 0; right: 0; bottom: 0;
  padding-bottom: max(8px, var(--safe-b));
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.dock-in {
  max-width: 560px; margin: 0 auto; padding: 8px 8px 8px; border-radius: 30px; pointer-events: auto;
  background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6);
  border: 1px solid color-mix(in srgb, var(--line) 80%, transparent); box-shadow: var(--shadow-lift);
}
.tools { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 2px 4px 2px; }
.weeknav { display: flex; align-items: center; min-width: 0; }
.weeknav .lbl { min-width: 0; padding: 0 2px; font-size: 14.5px; font-weight: 500; letter-spacing: .02em; color: var(--ink-2); white-space: nowrap; }
.navb { width: 44px; height: 48px; padding: 0; border: 0; background: none; border-radius: 16px; color: var(--rose-ink); display: grid; place-items: center; }
.navb:disabled { color: var(--line); cursor: default; }
.add {
  display: inline-flex; align-items: center; gap: 6px; height: 48px; padding: 0 20px 0 14px; border: 0; border-radius: 24px 24px 24px 10px;

/* motion-kit:start */
/*!
 * motion-kit.js — iPhone 向けの共通モーション（Motion for JavaScript の上に薄く載せる）
 * 必要なもの：先に Motion（UMD 版、window.Motion）を読み込むこと。
 *   読み込む順：vendor/motion.js（または https://cdn.jsdelivr.net/npm/motion@14.6.0/dist/motion.js）→ motion-kit.js
 *   ※ HTML に直接書き込むときに備え、このファイルの中には script の閉じタグを書かない
 * 使うのは transform（x / y / scale）と opacity だけ。レイアウトを揺らさず、iOS Safari でも滑らかに動く。

(function (global) {

    };

  const TOKENS = Object.freeze({
    duration: { instant: 0.08, fast: 0.18, base: 0.28, slow: 0.4 },
    ease: {
      standard: [0.25, 0.8, 0.25, 1],   // 一般的な変化
      decel: [0.16, 1, 0.3, 1],         // 入ってくる
      accel: [0.4, 0, 1, 1],            // 出ていく
    },

    spring: {
      release: { type: "spring", visualDuration: 0.3, bounce: 0.1 },   // 指を離して戻る
      ui: { type: "spring", visualDuration: 0.32, bounce: 0.06 },      // 出現・インジケーター
      sheet: { type: "spring", visualDuration: 0.42, bounce: 0.04 },   // シート・画面
      snap: { type: "spring", visualDuration: 0.28, bounce: 0 },       // スワイプの戻り
    },
    scale: { press: 0.96, pressLarge: 0.98, pressIcon: 0.9, enterFrom: 0.98, check: 0.86 },
    fade: { in: 0.2, out: 0.14 },
    distance: { enter: 8, exit: 24, swap: 14, reveal: 16, tapSlop: 10, swipeOpen: 88 },
    // 画面遷移の方向：階層を進む＝右から、戻る＝左へ、モーダル＝下から、タブ／カテゴリ＝並び順の方向
    direction: { forward: 1, back: -1 },

  // ---- 1. タップ：押すと縮み、離すと自然に戻る（イベント委譲なので後から足した要素にも効く）----
  // <button data-press>…</button>  縮小率を変えるなら data-press="large" | "icon" | 0.94 など
  function pressable(root = document, selector = "[data-press]") {
    let cur = null, sx = 0, sy = 0;
    const scaleOf = (el) => {
      const v = el.dataset.press;
      return v === "large" ? TOKENS.scale.pressLarge : v === "icon" ? TOKENS.scale.pressIcon : Number(v) || TOKENS.scale.press;
    };

      if (!cur) return;

    global.addEventListener("pointermove", move, { passive: true });
    global.addEventListener("pointerup", release, { passive: true });
    global.addEventListener("pointercancel", release, { passive: true });
    global.addEventListener("blur", release);
    return () => {
      root.removeEventListener("pointerdown", down);
      global.removeEventListener("pointermove", move);
      global.removeEventListener("pointerup", release);
      global.removeEventListener("pointercancel", release);
      global.removeEventListener("blur", release);
    };
  }

  // ---- 2. リスト：追加・削除・並び替え（周りの項目も自然に動く）----
  const layoutOpts = () => opt(tween("base", "standard"));
  const tag = (list) => [...list.children].forEach((c) => { if (!c.hasAttribute("data-layout")) c.setAttribute("data-layout", ""); });

  function enter(el, { from = "top" } = {}) {
    const y = from === "top" ? -TOKENS.distance.enter : from === "bottom" ? TOKENS.distance.enter : 0;
    return animate(el, { opacity: [0, 1], scale: [TOKENS.scale.enterFrom, 1], y: [y, 0] }, opt(TOKENS.spring.ui));
  }
  async function listAdd(list, el, { at = "end" } = {}) {
    tag(list); el.setAttribute("data-layout", "");
    if (!reduced()) el.style.opacity = "0";
    const done = animateLayout(list, () => { at === "start" ? list.prepend(el) : list.append(el); }, layoutOpts());

  async function listRemove(list, el, { toX = 0 } = {}) {

    if (!reduced()) await wait(animate(el, { opacity: 0, scale: TOKENS.scale.enterFrom, x: toX }, tween("fast", "accel")));

  function listReorder(list, update) { tag(list); return wait(animateLayout(list, update, layoutOpts())); }
  // 画面を作り直すとき（innerHTML で描き直す場合も含む）に、同じ data-layout-id の要素を前の位置から滑らかに動かす。
  // 行だけに data-layout-id を付け、行を入れている箱（カードや一覧）には付けない（中身が伸び縮みして見えるため）
  function layout(scope, update) {
    if (reduced()) { update(); return Promise.resolve(); }
    return wait(animateLayout(scope, update, layoutOpts()));
  }
  // 消える前の短い動き（出ていく＝加速）
  function fadeOut(el, { toX = 0 } = {}) {
    if (reduced() || !el || !el.isConnected) return Promise.resolve();
    return wait(animate(el, { opacity: 0, scale: TOKENS.scale.enterFrom, x: toX }, tween("fast", "accel")));
  }
  function fadeTo(el, to) { return wait(animate(el, { opacity: to }, opt(to ? tween("base", "standard") : tween("fast", "standard")))); }

  // ---- 3. チェック：枠が塗られ、チェックの線が描かれる ----
  // <button class="mk-check" aria-pressed="false"><svg><path pathLength="1" d="…"/></svg></button>
  // CSS 側で path に stroke-dasharray: 1 を指定しておく
  function check(btn, on) {
    const path = btn.querySelector("path");
    btn.setAttribute("aria-pressed", String(on));
    if (reduced()) { if (path) path.style.strokeDashoffset = on ? "0" : "1"; return Promise.resolve(); }

    const b = on ? animate(btn, { scale: [TOKENS.scale.check, 1] }, TOKENS.spring.release) : null;
    return Promise.all([wait(a), wait(b)]);
  }

  // ---- 4. 開閉（アコーディオン）----
  function collapse(panel, open) {
    const from = panel.getBoundingClientRect().height;
    panel.hidden = false;
    panel.style.overflow = "hidden";
    panel.style.height = "auto";
    const to = open ? panel.scrollHeight : 0;
    panel.style.height = from + "px";
    const a = animate(panel, { height: [from, to], opacity: open ? [0, 1] : [1, 0] }, opt(tween("base", "standard")));
    return wait(a).then(() => {
      panel.style.height = open ? "" : "0px";
      panel.style.overflow = open ? "" : "hidden";
      if (!open) { panel.hidden = true; panel.style.height = ""; }
      panel.style.opacity = "";
    });
  }

  // ---- 5. シート（モーダル）：下から出て、下へ消える。取っ手を下に引いても閉じる ----
  function sheetOpen(sheet, backdrop) {

    sheet.hidden = true; if (backdrop) backdrop.hidden = true;

  function sheetDrag(sheet, handle, onClose) {

    handle.style.touchAction = "none";
    handle.addEventListener("pointerdown", (e) => { active = true; sy = e.clientY; dy = 0; t0 = performance.now(); handle.setPointerCapture(e.pointerId); });

      if (!active) return;
      dy = Math.max(0, e.clientY - sy);
      sheet.style.transform = `translateY(${dy}px)`;
    });
    const end = () => {
      if (!active) return; active = false;
      const v = dy / Math.max(1, performance.now() - t0) * 1000;   // px/s
      sheet.style.transform = "";

      else animate(sheet, { y: [dy, 0] }, opt(TOKENS.spring.snap));
    };
    handle.addEventListener("pointerup", end);
    handle.addEventListener("pointercancel", end);
  }

  // ---- 6. 切り替え：インジケーターの移動と、中身の入れ替え（並び順の方向へ）----
  function moveIndicator(indicator, target, { instant = false } = {}) {
    const parent = indicator.offsetParent; if (!parent) return Promise.resolve();
    const box = parent.getBoundingClientRect(), r = target.getBoundingClientRect();
    // 絶対配置の基準は枠線の内側なので、親の枠線の太さ（clientLeft）を引く
    return animate(indicator, { x: r.left - box.left - parent.clientLeft, width: r.width }, instant ? INSTANT : opt(TOKENS.spring.ui));
  }
  async function swap(container, update, dir = 0) {
    const d = TOKENS.distance.swap * Math.sign(dir);
    if (reduced()) { update(); return; }
    await wait(animate(container, { opacity: 0, x: -d }, tween("fast", "accel")));
    update();
    await wait(animate(container, { opacity: [0, 1], x: [d, 0] }, TOKENS.spring.ui));
  }

  // ---- 7. スクロール：ヘッダーの変化と、画面に入った要素の表示 ----
  // ヘッダー：0〜range px のスクロールに合わせて --mk-collapse を 0→1 にする（CSS 側で使う）
  function scrollHeader(el, { range = 56 } = {}) {
    let last = -1;
    return scroll(() => {
      const p = Math.min(1, Math.max(0, global.scrollY / range));
      const q = Math.round(p * 100) / 100;
      if (q === last) return; last = q;
      el.style.setProperty("--mk-collapse", String(q));
      el.toggleAttribute("data-collapsed", q >= 1);
    });

      el.classList.remove("mk-pending");

    }, { amount });
  }

  // ---- 8. スワイプ：横に引くと削除ボタンが出る／大きく引くと削除。タップとは区別する ----
  // <li data-swipe><div class="mk-swipe-bg"><button>削除</button></div><div class="mk-swipe-fg">…</div></li>
  function swipeRow(row, { onDelete, openWidth = TOKENS.distance.swipeOpen } = {}) {
    const fg = row.querySelector(".mk-swipe-fg");
    let sx = 0, sy = 0, base = 0, x = 0, axis = null, t0 = 0, id = null;
    // 本体が横にずれている間だけ data-moving を付ける（CSS で、その間だけ下の「削除」を見せる。角丸の縁から赤が透けないように）
    const set = (v) => { x = v; row.toggleAttribute("data-moving", v !== 0); fg.style.transform = `translateX(${v}px)`; };
    const to = (v, o) => {
      const from = x; x = v; fg.style.transform = ""; row.setAttribute("data-moving", "");
      const a = animate(fg, { x: [from, v] }, opt(o || TOKENS.spring.snap));
      wait(a).then(() => { if (x === 0) row.removeAttribute("data-moving"); });
      return a;
    };
    const close = () => { row.removeAttribute("data-open"); return to(0); };
    fg.addEventListener("pointerdown", (e) => { if (!e.isPrimary) return; id = e.pointerId; sx = e.clientX; sy = e.clientY; base = x; axis = null; t0 = performance.now(); });
    fg.addEventListener("pointermove", (e) => {
      if (e.pointerId !== id) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (!axis) {   // 最初に大きく動いた向きで決める（縦ならスクロールに任せる）
        if (Math.hypot(dx, dy) < TOKENS.distance.tapSlop) return;
        axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
        if (axis === "x") { fg.setPointerCapture(id); row.dataset.swiping = "1"; }
      }
      if (axis !== "x") return;
      let v = base + dx;
      if (v > 0) v = v * 0.2;   // 右へはほとんど動かない（ゴムのような抵抗）
      set(v);
    });
    const end = (e) => {
      if (e.pointerId !== id) return; id = null;
      if (axis !== "x") return;
      const w = fg.offsetWidth, vel = (x - base) / Math.max(1, performance.now() - t0) * 1000;
      // 削除まで進むのは、幅の55%以上引いたとき、または素早くはじいて幅の35%以上動いたとき（うっかり削除を防ぐ）
      if (x < -w * 0.55 || (vel < -1200 && x < -w * 0.35)) { to(-w, tween("fast", "accel")).then(() => onDelete && onDelete(row)); }
      else if (x < -openWidth / 2 || vel < -500) { row.setAttribute("data-open", ""); to(-openWidth); }
      else close();
      setTimeout(() => { delete row.dataset.swiping; }, 0);
    };
    fg.addEventListener("pointerup", end);
    fg.addEventListener("pointercancel", end);
    // スワイプの後に起きるクリックは無視し、開いた行はタップで閉じる
    fg.addEventListener("click", (e) => {
      if (row.dataset.swiping || row.hasAttribute("data-open")) { e.preventDefault(); e.stopPropagation(); if (!row.dataset.swiping) close(); }
    }, true);
    return { close };
  }

  global.MotionKit = Object.freeze({
    TOKENS, reduced, tween,
    pressable, enter, listAdd, listRemove, listReorder, layout, fadeOut, fadeTo, check,
    collapse, sheetOpen, sheetClose, sheetDrag, moveIndicator, swap,
    scrollHeader, reveal, swipeRow,
  });
})(window);
/* motion-kit:end */

<script>
(function () {
  document.documentElement.classList.add("preload");

  const LS_KEY = "mochimono-v1", LS_DIRTY = "mochimono-dirty", LS_NEXT = "mochimono-next";   // 保存先は前の版と同じ
  const ORDER = [1, 2, 3, 4, 5, 6, 0];
  const WD = ["日", "月", "火", "水", "木", "金", "土"];
  const EVENING = 18;
  const KEEP_DAYS = 30;
  const SHEETS = ["addSheet", "editSheet", "planSheet"];

    enter: { type: "spring", visualDuration: 0.44, bounce: 0.2 },    // 持ち物が入ってくる
    exit: { duration: 0.2, ease: K.TOKENS.ease.accel },              // 出ていく（速く・加速）
    slideOut: { duration: 0.14, ease: K.TOKENS.ease.accel },         // 日付切り替え：今の画面が去る
    slideIn: { type: "spring", visualDuration: 0.4, bounce: 0.16 },  // 日付切り替え：次の画面が来る
    strip: { type: "spring", visualDuration: 0.42, bounce: 0.18 },   // 週の帯・選択のアーチ
    sheet: K.TOKENS.spring.sheet,
    stagger: 0.04,
  };
  const anim = (el, kf, o) => (M && !K.reduced() && el ? M.animate(el, kf, o).then(() => {}, () => {}) : Promise.resolve());

  let state = emptyState();
  let selDate = null, weekStart = null, autoKey = "";
  let docRef = null, writing = false, pending = false, dirty = false;
  let justChecked = null, justAdded = new Set(), lastBloom = { date: null, all: false, done: -1 };
  let undoSnap = null, toastTimer = null;
  let editing = null;
  let openerEl = null, savedScroll = 0, sheetSeq = 0;
  let aMode = "once", aNext = true;
  try { aNext = localStorage.getItem(LS_NEXT) !== "0"; } catch (e) {}

  const $ = (id) => document.getElementById(id);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const pad = (n) => String(n).padStart(2, "0");
  const dstr = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const today = () => dstr(new Date());
  const ymd = (s) => { const [y, m, d] = s.split("-").map(Number); return [y, m - 1, d]; };
  const parse = (s) => new Date(...ymd(s));
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return dstr(d); };
  const diffDays = (a, b) => Math.round((Date.UTC(...ymd(b)) - Date.UTC(...ymd(a))) / 86400000);
  const md = (s) => { const d = parse(s); return (d.getMonth() + 1) + "/" + d.getDate(); };
  const mdj = (s) => { const d = parse(s); return (d.getMonth() + 1) + "月" + d.getDate() + "日"; };
  const wdOf = (s) => parse(s).getDay();
  const fmt = (s) => md(s) + "（" + WD[wdOf(s)] + "）";
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const rel = (s) => { const n = diffDays(today(), s); return n < 0 ? "過ぎた日" : n === 0 ? "今日" : n === 1 ? "明日" : n === 2 ? "あさって" : n + "日後"; };
  const byCreated = (a, b) => (a.created || 0) - (b.created || 0);
  const monday = (s) => addDays(s, -((wdOf(s) + 6) % 7));
  const minWeek = () => monday(today());
  // 同じ持ち物かどうか（全角・半角、空白、大文字小文字の違いは同じとみなす）
  const sameKey = (s) => String(s).normalize("NFKC").replace(/\s+/g, "").toLowerCase();

  // ---- アイコン ----
  // 操作の記号（矢印・ゴミ箱など）は Lucide。世界観に関わる記号（花のチェック・つぼみ・花輪など）は、このアプリ用に描いた線画
  const IC_FALLBACK = { ChevronLeft: "‹", ChevronRight: "›", Ellipsis: "…", Trash2: "×", Check: "✓", Undo2: "↺" };
  function ic(name, attrs) {
    const L = window.lucide;
    if (L && L[name] && L.createElement) {
      const svg = L.createElement(L[name], Object.assign({ "stroke-width": 1.9, "aria-hidden": "true" }, attrs || {}));
      svg.classList.add("ic");
      return svg;
    }
    const s = document.createElement("span");
    s.className = "ic ic-fb"; s.setAttribute("aria-hidden", "true"); s.textContent = IC_FALLBACK[name] || "";

  // ---- 日付の切り替え：今の画面が進む方向の反対へ去り、次の画面が ばね で入る ----
  let slideSeq = 0;

  // ---- 本文の横スワイプで前の日・次の日へ（指についてきて、離すと続きから滑る）----
  let pageSwiped = false;
  (function swipeDays() {
    const area = $("main");
    const movers = () => [$("headTxt"), $("content")];
    let id = null, sx = 0, sy = 0, dx = 0, axis = null, t0 = 0, cur = 0;
    area.addEventListener("pointerdown", (e) => {
      if (!e.isPrimary || e.button > 0) return;
      id = e.pointerId; sx = e.clientX; sy = e.clientY; dx = 0; axis = null; t0 = performance.now(); pageSwiped = false; cur = 0;
    });

      const o = 1 - Math.min(.35, Math.abs(cur) / 260);

  // ---- 週の切り替え ----

    const wrap = $("stripWrap"), strip = $("strip");

    wrap.addEventListener("pointerdown", (e) => {

    });

  // ---- キーボード（iOS Safari）：Visual Viewport で「見えている範囲」を測り、シートをその中に収める ----

      $("eNote").textContent = (it.from && it.from > today() ? fmt(it.from) + "から表示します。" : "") + "毎週" + WD[it.wd] + "曜日に自動で表示されます。"; $("eNote").hidden = false;
      $("eSkip").hidden = !!(it.from && it.from > date);
      $("eSkipT").textContent = skipped ? fmt(date) + "も持っていく" : fmt(date) + "だけ外す";
      $("eDelT").textContent = "毎週の設定から削除";
    }
    if (switching) hideSheets("switch");
    openSheet("editSheet", opener, false);
  }
  $("editSheet").addEventListener("submit", (e) => {
    e.preventDefault();
    if (!editing) return hideSheets();
    const it = editing.kind === "w" ? findW(editing.id) : findX(editing.id);
    const text = $("eText").value.trim();
    if (!it) return hideSheets();
    if (!text) return showErr("eErr", "持ち物を入力してください。");
    if (editing.kind === "x") {
      const d = $("eDate").value;
      if (!DATE_RE.test(d)) return showErr("eErr", "持っていく日を選んでください。");
      if (d < today() && d !== it.date) return showErr("eErr", "今日より前の日は選べません。");
      it.date = d;
    }
    it.text = text;
    hideSheets(); commit();
  });
  $("eSkip").onclick = () => {
    if (!editing || editing.kind !== "w") return;
    const { id, date } = editing, on = !(state.skips[date] || []).includes(id);
    hideSheets(); setSkip(id, date, on, true);
  };
  // 削除：シートが下がると同時に、その行が横へ抜けてから消える（下の行が詰める）。自動登録はやり直さないので、消した物が勝手に戻ることはない
  $("eDel").onclick = async () => {
    if (!editing) return;
    const { kind, id } = editing, it = kind === "w" ? findW(id) : findX(id);
    if (!it) return hideSheets();
    snapshot();
    const li = document.querySelector('#content .item[data-layout-id="' + kind + "-" + id + '"]');
    hideSheets();
    if (li) await anim(li, { x: -60, opacity: 0, scale: .96 }, MO.exit);
    if (kind === "w") state.weekly = state.weekly.filter(x => x.id !== id); else state.extras = state.extras.filter(x => x.id !== id);
    commit();
    toast("「" + it.text + "」を削除しました");
  };

  // ---- 予定 ----
  function renderPlan() {
    const t = today(), box = $("planList");
    const list = state.extras.filter(x => x.date >= t).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : byCreated(a, b));
    box.innerHTML = "";
    $("planNone").hidden = !!list.length;
    const groups = new Map();
    list.forEach(x => { if (!groups.has(x.date)) groups.set(x.date, []); groups.get(x.date).push(x); });
    groups.forEach((items, d) => {
      const g = el("div", "plan-day");
      const h = el("p", "plan-h", fmt(d)); h.append(el("span", "rel", rel(d)));
      const card = el("div", "plan-g");
      items.forEach(x => {
        const b = el("button", "plan-row"); b.type = "button"; b.dataset.press = "large";
        b.append(el("span", "", x.text));
        if (x.auto) { const tg = el("span", "tag peach"); tg.append(gl("carry"), document.createTextNode("先週から")); b.append(tg); }
        b.append(ic("ChevronRight"));
        b.setAttribute("aria-label", fmt(d) + " " + x.text + (x.auto ? "（自動）" : "") + " の編集");
        b.onclick = () => openEdit("x", x.id, x.date, $("planBtn"), true);
        card.append(b);
      });
      g.append(h, card);
      box.append(g);
    });
  }
  $("planBtn").onclick = () => { renderPlan(); openSheet("planSheet", $("planBtn"), false); };

  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
  setInterval(() => { if (curKey() !== autoKey) render(); else renderStrip(); }, 60000);

  // ---- 起動 ----
  paintIcons();
  state = loadLocal(); prune();
  render();
  K.pressable(document, "button");
  document.querySelectorAll(".act, .kind, .primary, .switch-row, .ghost").forEach(b => { b.dataset.press = "large"; });
  document.querySelectorAll(".navb, .plan-btn").forEach(b => { b.dataset.press = "icon"; });
  $("fab").dataset.press = "0.93";
  SHEETS.forEach(id => { const g = $(id).querySelector(".grab"); if (g) K.sheetDrag($(id), g, () => hideSheets("dragged")); });
  K.scrollHeader($("cbar"), { range: 140 });
  measureDock(); moveSel(true); fitViewport();
  window.addEventListener("resize", () => { measureDock(); moveSel(true); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measureDock(); moveSel(true); });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.documentElement.classList.remove("preload");
    bootDone = true;
    // 開いたとき：つぼみから今の進み具合まで咲かせる
    const d = selDate; lastBloom.date = null; bloomKind = -1;
    const checks = new Set(state.checks[d] || []), skips = new Set(state.skips[d] || []);
    const act = state.extras.filter(x => x.date === d).concat(weeklyOn(d).filter(w => !skips.has(w.id)));
    setBloom(act.filter(i => checks.has(i.id)).length, act.length, d, true);
  }));
  setSync("local");

  (async function connect() {
    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.collection("data/users/" + id).doc("mochimono");
      let first = true;
      setSync("syncing");
      const timer = setTimeout(() => { setSync("error", "同期先につながりません。この端末には保存されます。"); }, 10000);
      ref.onSnapshot((snap) => {
        if (!snap.metadata.fromCache) clearTimeout(timer);
        if (snap.metadata.hasPendingWrites) return;
        if (first && snap.metadata.fromCache && !snap.exists) return;
        const data = snap.exists ? snap.data() : null;
        if (first) {
          first = false; docRef = ref;
          if (!data) {
            if (state.weekly.length || state.extras.length) { dirty = true; flush(); }
            else setSync("synced");
            return;
          }
        }
        if (!data) return;
        if (dirty || writing) { flush(); return; }
        state = normalize(data); prune();
        saveLocal(); K.layout($("content"), render);
        if (!snap.metadata.fromCache) setSync("synced");
      }, () => { clearTimeout(timer); docRef = null; setSync("error", "同期できませんでした。この端末には保存されています。"); });
    } catch (e) { /* この端末の保存だけで動く */ }
  })();
})();
</script>
